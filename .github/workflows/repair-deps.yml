name: TaskFlowPro one-time dependency remediation
on:
  push:
    branches: [ci/verify-20261123]
    paths:
      - .github/workflows/repair-deps.yml
permissions:
  contents: write
jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/verify-20261123
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh compatible lockfile resolutions
        run: |
          set -euo pipefail
          npm install react-router-dom@latest vite@latest @vitejs/plugin-react@latest --save
          npm audit fix --package-lock-only
          npm ci
          npm run build
          npm audit --audit-level=high
      - name: Commit verified lockfile update
        run: |
          set -euo pipefail
          git add package.json package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(deps): update TaskFlowPro audited lockfile'
          git push origin HEAD:ci/verify-20261123
