name: TaskFlowPro quality
on:
  push:
    branches: [ci/verify-20261123, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reproducible install
        run: npm ci
      - name: Production build (TypeScript + Vite)
        run: npm run build
      - name: Vulnerability audit
        run: npm audit --audit-level=high
